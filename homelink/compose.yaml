services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      APP_NAME: HomeLink
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8080
      HOMELINK_DEMO: "true"
      DEMO_SEED: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/homelink/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    volumes:
      - homelink-data:/var/lib/homelink
      - homelink-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  homelink-data:
  homelink-storage:
