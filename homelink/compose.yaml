services:
  app:
    build: .
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    environment:
      APP_NAME: HomeLink
      APP_ENV: production
      APP_KEY: "${APP_KEY:?Set APP_KEY in the shell or a Compose .env file}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:?Set APP_URL to the public HTTPS URL}"
      HOMELINK_DEMO: "false"
      DEMO_SEED: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/homelink-db/database.sqlite
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
    volumes:
      - homelink-data:/var/lib/homelink
      - homelink-database:/var/lib/homelink-db
      - homelink-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  homelink-data:
  homelink-database:
  homelink-storage:
